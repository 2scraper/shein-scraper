name: canary

on:
  schedule:
    - cron: "41 6 * * *"   # once daily; avoid :00 so it doesn't pile up with everyone else's
  workflow_dispatch: {}     # dispatch manually at least once before trusting the badge

jobs:
  # A real local-first browser run.
  #
  # Fixed 2026-09-22 to match skyscanner-scraper's canary pattern (see that
  # repo's canary.yml/CHANGELOG.md): this job used to require EXIT_OK=0
  # outright, which is wrong for THIS site specifically — shein.com's own
  # `/risk/challenge` and `/risk/action/limit` gateways are a CONFIRMED,
  # live, intermittent behavior (see README "Read this before trusting a
  # run" / shein_parser.py's module docstring), not a hypothetical. A
  # canary that goes red every time shein.com's own defense fires teaches
  # everyone to ignore the check — the exact failure mode CLAUDE.md §11
  # warns about for a different reason (a permanently-red claude.yml).
  # EXIT_CRASH/EXIT_BAD_USAGE (1/2) are real bugs in THIS repo's own code
  # and stay a hard failure; EXIT_BLOCKED/EXIT_ZERO_PRODUCTS/
  # EXIT_REMOTE_API_ERROR (3/4/5) are the site's own defense or a locale/
  # markup surprise, reported as a notice so the badge stays meaningful.
  #
  # Thresholds below (product floor, price-confirmed pct) are deliberately
  # conservative relative to lidl-scraper's sibling canary: this repo's
  # scroll-driven pagination growth (does scrolling actually add NEW
  # products past the first confirmed window.gbRawData batch of ~20?) is
  # documented as unconfirmed — see README "Pagination" / TESTING.md.
  # Requiring only one completed round and a product floor below the
  # confirmed first-batch size avoids a canary that's red for a reason
  # this repo has already told you it doesn't know the answer to yet.
  # Once a real run confirms scroll growth one way or the other, tighten
  # this the same way lidl-scraper's was tightened after its own first
  # live multi-round run (see CHANGELOG.md).
  canary-local:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install -r requirements-playwright.txt
          playwright install --with-deps chromium

      - name: Run the local-first default against a real search
        run: |
          set +e
          python3 playwright_scraper.py \
            --query "dress" --max-results 15 --format json --out canary_out.json --dump-html
          echo "exit_code=$?" >> "$GITHUB_ENV"

      - name: Interpret the exit code — only a crash/bad-usage is a real CI failure
        run: |
          python3 -c "
          import json, os, sys

          code = int(os.environ['exit_code'])
          print(f'playwright_scraper.py exited {code}')

          # EXIT_OK=0 / EXIT_PARTIAL=6: a real, trustworthy run — check the
          # plausible-product floor from the sibling comment above.
          if code in (0, 6):
              meta = json.load(open('canary_out.json.meta.json'))
              print(json.dumps(meta, indent=2))
              assert meta['pages_completed'] >= 1, meta
              assert meta['product_count'] >= 10, meta
              assert (meta['price_confirmed_pct'] or 0) >= 0.9, meta
              print(f\"canary: got {meta['product_count']} products in {meta['pages_completed']} round(s), status={meta['status']}\")

          # EXIT_BLOCKED=3 / EXIT_ZERO_PRODUCTS=4 / EXIT_REMOTE_API_ERROR=5:
          # finish_run() writes NO sidecar for any of these by design (a
          # stale 'failed' sidecar must never sit beside a previous good
          # output). shein.com's own /risk/challenge and /risk/action/limit
          # gateways are a CONFIRMED, live, intermittent behavior (see
          # README), so this most likely means 'the site's own defense
          # fired this run' — worth investigating via the uploaded debug
          # HTML, not a broken build. Report it as a notice, not a failure.
          elif code in (3, 4, 5):
              print(f'::notice::exit {code} — no sidecar written (blocked/empty/remote-api-error, '
                    f'by finish_run design). Most likely shein.com\\'s own /risk/challenge or '
                    f'/risk/action/limit gateway fired this run (a confirmed, live, intermittent '
                    f'behavior — see README) — inspect canary_out_debug.html from this run\\'s '
                    f'uploaded artifact before assuming a code regression.')

          # EXIT_CRASH=1 / EXIT_BAD_USAGE=2: an unhandled exception or a
          # usage bug in THIS repo's own code, independent of what the live
          # site returned — this is a real failure.
          elif code in (1, 2):
              print(f'::error::exit {code} is a crash/bad-usage outcome — a real bug in this '
                    f'repo\\'s own code, not a live-site surprise. See the previous step\\'s log.')
              sys.exit(1)

          else:
              print(f'::error::unrecognised exit code {code}')
              sys.exit(1)
          "

      - name: Upload artifacts (output + debug HTML) on every run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canary-local-${{ github.run_id }}
          path: |
            canary_out.json
            canary_out.json.meta.json
            canary_out_debug.html
          retention-days: 14

  # Opt-in, mirroring the rest of the family's pattern: exercises the
  # --cdp-endpoint (2Captcha Scraping Browser API) path when a repo secret
  # is configured. Skips cleanly — not red — when it isn't. Also the best
  # place to observe whether the Scraping Browser API's own device
  # identity avoids the confirmed /risk/challenge redirect entirely — see
  # TESTING.md step 6.
  canary-cdp:
    runs-on: ubuntu-latest
    env:
      HAS_CDP: ${{ secrets.SHEIN_CDP_ENDPOINT != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Skip — no SHEIN_CDP_ENDPOINT secret configured
        if: env.HAS_CDP != 'true'
        run: |
          echo "::notice::Skipping the Scraping Browser API run: no SHEIN_CDP_ENDPOINT \
          secret is set. This is optional — canary-local above already exercises this repo's \
          local-first default with no secrets at all. Set SHEIN_CDP_ENDPOINT (and \
          TWOCAPTCHA_KEY) as repo secrets to also turn this job on. This is a SKIP, not a pass \
          or a fail."

      - uses: actions/setup-python@v5
        if: env.HAS_CDP == 'true'
        with:
          python-version: "3.12"
      - run: pip install -r requirements-playwright.txt
        if: env.HAS_CDP == 'true'

      # Both secrets go through the ENVIRONMENT, never a command-line flag
      # (credentials never reach argv). env_config.py already reads
      # SHEIN_CDP_ENDPOINT/TWOCAPTCHA_KEY unconditionally, so this is
      # correct with or without either secret set.
      - name: Run over the Scraping Browser API
        if: env.HAS_CDP == 'true'
        env:
          SHEIN_CDP_ENDPOINT: ${{ secrets.SHEIN_CDP_ENDPOINT }}
          TWOCAPTCHA_KEY: ${{ secrets.TWOCAPTCHA_KEY }}
        run: |
          python3 playwright_scraper.py \
            --query "summer dress" --max-results 10 --format json --out canary_cdp_out.json --dump-html

      - name: Upload artifacts on every non-skipped run
        if: always() && env.HAS_CDP == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: canary-cdp-${{ github.run_id }}
          path: |
            canary_cdp_out.json
            canary_cdp_out.json.meta.json
            canary_cdp_out_debug.html
          retention-days: 14
